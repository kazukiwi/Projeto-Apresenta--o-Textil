{% set caminho = request.url.path if request is defined else '' %}
<link rel="stylesheet" href="/static/css/base.css?v=1">
<link rel="stylesheet" href="/static/css/ui.css?v=1">
<link rel="stylesheet" href="/static/css/feedback.css?v=1">
<header>
    <nav class="navbar">
        <div class="logo"><a href="/"><img src="/static/img/logo.png" alt="Logo AAPM"></a></div>
        <ul class="menu">
            <li><a href="/" class="{{ 'active' if caminho == '/' else '' }}">Dashboard</a></li>
            <li><a href="/produtos" class="{{ 'active' if caminho.startswith('/produtos') else '' }}">Produtos</a></li>
            {% if usuario.role == 'admin' %}
            <li><a href="/clientes" class="{{ 'active' if caminho.startswith('/clientes') else '' }}">Clientes</a></li>
            {% endif %}
            <li><a href="/pdv/" class="{{ 'active' if caminho.startswith('/pdv') else '' }}">Vendas</a></li>
            <li><a href="/mais_vendidos" class="{{ 'active' if caminho == '/mais_vendidos' else '' }}">Mais vendidos</a></li>
            {% if usuario.role == 'admin' %}
            <li><a href="/armarios" class="{{ 'active' if caminho.startswith('/armarios') else '' }}">Armários</a></li>
            <li><a href="/usuarios" class="{{ 'active' if caminho.startswith('/usuarios') else '' }}">Usuários</a></li>
            <li><a href="/categorias" class="{{ 'active' if caminho.startswith('/categorias') else '' }}">Categorias</a></li>
            {% endif %}
            <li><a href="/auth/logout" data-logout-confirm class="btn-sair"><i class="fa-solid fa-right-from-bracket"></i> Sair</a></li>
        </ul>
    </nav>
</header>
<script src="/static/javascript/feedback.js?v=2"></script>
